name: Deploy Jekyll site to pyf

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-pyf"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site

      - name: Reject legacy project paths
        run: |
          if grep -R -E '(href|src|poster|content|data-url)="/marginalia/' _site; then
            echo "::error::Generated site still contains legacy /marginalia paths"
            exit 1
          fi

      - name: Configure restricted deploy key
        env:
          PYF_SSH_KEY: ${{ secrets.PYF_SSH_KEY }}
          PYF_SSH_KNOWN_HOSTS: ${{ secrets.PYF_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PYF_SSH_KEY" > "$HOME/.ssh/marginalia_deploy"
          printf '%s\n' "$PYF_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/marginalia_deploy"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy static site to pyf
        run: |
          for attempt in 1 2 3; do
            if rsync -az --delete-delay --delay-updates \
              --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
              -e "ssh -i $HOME/.ssh/marginalia_deploy -o IdentitiesOnly=yes" \
              _site/ marginalia-deploy@8.134.13.244:/; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1

      - name: Remove deploy key
        if: always()
        run: rm -f "$HOME/.ssh/marginalia_deploy"
